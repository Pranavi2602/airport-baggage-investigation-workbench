
name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "baggage-investigation-api/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "baggage-investigation-api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: airport_baggage_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airport_baggage_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: baggage-investigation-api

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        env:
          DB_PASSWORD: postgres
          DB_USERNAME: postgres
          DB_URL: jdbc:postgresql://localhost:5433/airport_baggage_db
        run: mvn -B verify
